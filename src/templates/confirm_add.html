{% extends "base.html" %}

{% block content %}
    <h2>Confirm application details</h2>

    {% if parse_notice %}
        <div class="notice">{{ parse_notice }}</div>
    {% endif %}

    <form method="post" action="/applications">
        <label for="company">Company:</label><br>
        <input type="text" id="company" name="company" value="{{ company }}" required><br>

        <label for="role">Role:</label><br>
        <input type="text" id="role" name="role" value="{{ role }}" required><br>

        <label for="date_applied">Date applied:</label><br>
        <input type="date" id="date_applied" name="date_applied" value="{{ today }}" required><br>

        <label for="status">Status:</label><br>
        <select id="status" name="status" data-status="{{ default_status }}" onchange="this.dataset.status = this.value">
            {% for status in statuses %}
            <option value="{{ status.value }}" {% if status.value == default_status %}selected{% endif %}>{{ status.value }}</option>
            {% endfor %}
        </select><br>

        <label for="total_rounds">Total rounds (optional):</label><br>
        <input type="number" id="total_rounds" name="total_rounds" min="0"><br>

        <label for="current_round">Current round (optional):</label><br>
        <input type="number" id="current_round" name="current_round" min="0"><br>

        <label for="feedback">Feedback (optional):</label><br>
        <input type="text" id="feedback" name="feedback" size="60"><br>

        <input type="hidden" name="job_post_url" value="{{ job_post_url }}">
        <input type="hidden" name="source_text" value="{{ source_text }}">

        <button type="submit">Save application</button>
    </form>
{% endblock %}
