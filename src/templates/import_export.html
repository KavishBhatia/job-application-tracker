{% extends "base.html" %}

{% block content %}
    {% if import_summary %}
        <div class="summary">{{ import_summary }}</div>
    {% endif %}

    <section>
        <h2>Export / Import</h2>
        <div class="export-actions">
            <a class="button--secondary" href="/export.csv">Export as CSV</a>
            <a class="button--secondary" href="/export.xlsx">Export as Excel</a>
        </div>
        <form method="post" action="/import" enctype="multipart/form-data">
            <label for="file">Import a CSV or Excel file:</label>
            <input type="file" id="file" name="file" accept=".csv,.xlsx" required>
            <button type="submit" class="button--secondary">Import</button>
        </form>
    </section>
{% endblock %}
